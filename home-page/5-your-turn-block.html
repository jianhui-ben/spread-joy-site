<div class="sjc-launch" hidden><button type="button" class="pill launch">I have something to share ↗</button></div>
<dialog id="modal" class="mode-2 skin-1 flow-2" aria-labelledby="title"><button class="close" aria-label="Close hope jar">×</button><header class="modal-header"><h1 id="title">A little hope goes a long way.</h1><p id="subtitle">Leave a little hope. Find a little joy. There’s room for yours here.</p></header>
<div class="content"><section class="jar-side" aria-label="Community hope jar"><h2>A jar full of possibility.</h2><p class="hint">Pick a heart. Discover a little hope.</p><div class="scene" id="scene"><svg class="jar-outline" viewBox="0 0 260 285" aria-hidden="true"><path d="M57 40 L57 25 Q58 19 68 19 L194 19 Q203 19 203 27 L203 40 Z M63 41 L63 62 C63 75 30 78 29 104 L29 238 Q29 269 60 269 L200 269 Q232 269 232 238 L232 104 C232 78 197 76 197 62 L197 41"/><path d="M54 30 L205 30"/><path class="shine" d="M44 112 L44 150 M44 163 L44 173"/></svg><div id="hearts"></div><span class="jar-wordmark">shared hopes</span></div><div class="readout" aria-live="polite" aria-atomic="true"><blockquote id="quote">“A world where everyone feels invited.”</blockquote><small id="attribution"></small><span class="mini-heart" aria-hidden="true">♥</span></div><button class="pill compose-toggle" id="compose">Add your hope ♥</button></section>
<section class="write-side" aria-label="Write a hope"><div id="form-content"><h2>What’s your hope?</h2><p class="intro">For yourself, for someone you love, or for the world. Big or small, it belongs here.</p><form id="hope-form"><label class="field-label" for="person-name">Your name</label><input id="person-name" name="name" type="text" required maxlength="50" autocomplete="given-name" placeholder="First name or chosen name"><p class="name-help">This name will appear with your hope.</p><label class="field-label" for="hope">Your hope</label><div class="textarea-wrap"><textarea id="hope" maxlength="180" placeholder="Everyone finds a place they feel they belong." required></textarea><span class="counter" id="counter">0 / 180</span></div><p class="error" id="error" role="alert" hidden></p><button class="pill submit" type="submit">Add my hope to the jar ♥</button><p class="help">Keep it kind and leave out personal details.</p></form></div><div class="success" id="success" role="status" tabindex="-1" hidden><h3>Your hope has found a home. ♥</h3><p>Tap your heart to read your name and message.</p><button class="text-button" id="see-heart">Find my heart</button><button class="text-button" id="write-another">Leave another hope</button></div></section></div></dialog>
`;

const $=s=>root.querySelector(s);let mode=2,flow=2,lastHeart=null,opener=null,busy=false;// Starter hopes: add or edit {text, name} here. Leave name '' for no caption; use the writer's real name once they agree.
const messages=[{text:'A world where everyone feels invited.',name:''},{text:'More places where we can just be ourselves.',name:''},{text:'A friend to share the little victories with.',name:''},{text:'That kindness becomes an everyday habit.',name:''},{text:'A seat at the table for everyone.',name:''},{text:'More time with the people who make us smile.',name:''},{text:'That someone feels less alone today.',name:''},{text:'A little courage to try something new.',name:''}];
const path='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M49 90C40 78 5 51 9 28C13 4 36 9 48 28C62 4 86 5 92 25C100 49 65 78 49 90Z"/></svg>';const spots=[[49,85,-14],[105,81,9],[158,92,18],[64,135,13],[125,137,-15],[43,189,-12],[101,193,9],[159,187,17]];
function showMessage(i){$('#quote').textContent='“'+messages[i].text+'”';$('#attribution').textContent=messages[i].name||'';root.querySelectorAll('.heart').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.index)===i));}
function addHeart(i,animate=false){let p=spots[i]||[57+((i-8)%3)*52,111+Math.floor((i-8)%6/3)*60,((i%3)-1)*15];let b=document.createElement('button');b.type='button';b.className='heart'+(animate?' new':'');b.dataset.index=i;b.style.cssText=`left:${p[0]}px;top:${p[1]}px;--x:${p[0]}px;--y:${p[1]}px;--r:${p[2]}deg`;b.innerHTML=path;b.setAttribute('aria-label',messages[i].name?'Read the hope from '+messages[i].name:'Read community hope '+(i+1));b.setAttribute('aria-pressed','false');b.onclick=()=>showMessage(i);$('#hearts').append(b);return b}messages.forEach((m,i)=>addHeart(i));
function openModal(source){if(!$('#modal').open){opener=source;$('#modal').showModal();}$('.close').focus()}
root.querySelectorAll('.launch').forEach(b=>b.onclick=()=>openModal(b));$('.close').onclick=()=>$('#modal').close();$('#modal').addEventListener('close',()=>{opener?.focus()});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){let r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}});

function startWriting(){if(busy)return;$('#modal').classList.remove('celebrating');$('#modal').classList.add('composing');$('#form-content').hidden=false;$('#success').hidden=true;$('#error').hidden=true;$('#person-name').focus()}
$('#compose').onclick=startWriting;$('#hope').oninput=()=>{$('#counter').textContent=$('#hope').value.length+' / 180';$('#error').hidden=true};$('#person-name').oninput=()=>$('#error').hidden=true;
async function dropIntoJar(heart){
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduced)return;
 const scene=$('#scene').getBoundingClientRect(),rect=heart.getBoundingClientRect();
 const dx=scene.left+scene.width/2-(rect.left+rect.width/2);
 const dy=scene.top+12-rect.top;
 const flight=heart.animate([
 {translate:`${dx}px ${dy-38}px`,rotate:'-18deg',opacity:0},
 {translate:`${dx}px ${dy-20}px`,rotate:'-10deg',opacity:1,offset:.18},
 {translate:`${dx*.15}px -5px`,rotate:'7deg',opacity:1,offset:.78},
 {translate:'0px 4px',rotate:'-3deg',opacity:1,offset:.9},
 {translate:'0px 0px',rotate:'0deg',opacity:1}
 ],{duration:1250,easing:'cubic-bezier(.3,.1,.4,1)',fill:'both'});
 await flight.finished;flight.cancel();
 const jar=$('.jar-outline').animate([{rotate:'0deg'},{rotate:'1.3deg'},{rotate:'-1deg'},{rotate:'0deg'}],{duration:350});await jar.finished;
}
$('#hope-form').onsubmit=async e=>{
 e.preventDefault();if(busy)return;
 const text=$('#hope').value.trim(),name=$('#person-name').value.trim();
 if(!name||!text){$('#error').textContent=!name?'Please enter a name to go with your hope.':'Please write a hope before adding your heart.';$('#error').hidden=false;(!name?$('#person-name'):$('#hope')).focus();return}
 busy=true;$('.submit').disabled=true;
 messages.push({text,name});lastHeart=messages.length-1;
 $('#form-content').hidden=true;$('#success').hidden=true;
 $('#modal').classList.add('celebrating');
 if(flow===1)$('#modal').classList.remove('composing');
 $('#quote').textContent='A little more hope is on its way…';$('#attribution').textContent='Adding your heart';
 const heart=addHeart(lastHeart,false);heart.style.visibility='hidden';
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 $('#scene').scrollIntoView({block:'center',behavior:'instant'});
 heart.style.visibility='visible';
 try{await dropIntoJar(heart)}finally{
 showMessage(lastHeart);$('#success').hidden=false;
 busy=false;$('.submit').disabled=false;
 $('#success').focus({preventScroll:true});
 }
};
$('#see-heart').onclick=()=>{showMessage(lastHeart);const b=root.querySelector(`[data-index="${lastHeart}"]`);b.scrollIntoView({block:'nearest'});b.focus()};
$('#write-another').onclick=()=>{$('#hope-form').reset();$('#counter').textContent='0 / 180';startWriting()};


// Optional: link an existing Squarespace card/button to #share-a-hope.
document.addEventListener('click', event => {
  const link = event.target.closest && event.target.closest('a[href="#share-a-hope"]');
  if (!link || !host.isConnected) return;
  event.preventDefault();
  openModal(link);
}, true); // capture phase: Squarespace stops link clicks before they bubble up to the page

})();
