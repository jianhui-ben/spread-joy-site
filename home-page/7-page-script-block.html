/* ===== PART 1: logic (assets/joy.js) ===== */
(function (root) {
  // PLACEHOLDER: made-up starting number for the "ripples of joy" counter.
  // Replace with real data later; nothing is stored between visits.
  var PLACEHOLDER_START_COUNT = 1284;

  // Kindness ideas from the owner's brainstorm doc. Edit this list; do not add facts.
  var IDEAS = [
    "Invite someone to join you who might otherwise be left out.",
    "Tell someone, \"I'm so glad you're here.\"",
    "Send a \"thinking of you\" message.",
    "Notice someone's effort and let them know.",
    "Ask someone how they're doing, and make time to listen.",
    "Celebrate someone's accomplishment, big or small.",
    "Thank someone whose work often goes unnoticed.",
    "Introduce yourself to someone new.",
    "Share a favorite memory with the person who made it special.",
    "Check in on someone you haven't heard from lately.",
    "Offer a specific helping hand: \"I can bring dinner.\"",
    "Tell someone what you admire about them.",
    "Make space for someone else's ideas.",
    "Cheer someone on as they try something new.",
    "Let someone know they make a difference in your life.",
    "Give someone a sincere compliment."
  ];

  function formatCount(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function createCounter(start) {
    var n = start;
    return {
      value: function () { return n; },
      tap: function () { n += 1; return n; }
    };
  }

  function shuffled(items, rng) {
    var a = items.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function createShuffler(items, rng) {
    rng = rng || Math.random;
    var queue = [];
    var last = null;
    return {
      next: function () {
        if (items.length === 1) return items[0];
        if (queue.length === 0) {
          queue = shuffled(items, rng);
          // keep a new cycle from opening with the previous cycle's last item
          if (queue[0] === last) {
            var swap = queue.length - 1;
            var t = queue[0]; queue[0] = queue[swap]; queue[swap] = t;
          }
        }
        last = queue.shift();
        return last;
      }
    };
  }

  var Joy = {
    PLACEHOLDER_START_COUNT: PLACEHOLDER_START_COUNT,
    IDEAS: IDEAS,
    formatCount: formatCount,
    createCounter: createCounter,
    createShuffler: createShuffler
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = Joy;
  root.Joy = Joy;
})(typeof window !== 'undefined' ? window : globalThis);

/* ===== PART 2: taps on heart and Surprise me (assets/home.js) ===== */
(function (root) {
  var MAX_RINGS = 6;
  var MAX_FLOATS = 12;
  var CONFETTI_EVERY = 10;
  var CONFETTI_BITS = 14;

  function reducedMotion(doc) {
    var view = doc.defaultView;
    return !!(view && view.matchMedia && view.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function closestWithId(node, id) {
    while (node) {

    return null;
  }

  // Clicks are handled on the whole document, and elements are looked up at click time,
  // because Squarespace's editor can re-draw a Code Block's HTML after this script has run.
  function initHome(doc, joy) {
    var html = doc.documentElement;
    if (html && html.classList.contains('sj-js')) return; // already running
    if (html) html.classList.add('sj-js'); // reveals the elements marked sj-needs-js

    var counter = joy.createCounter(joy.PLACEHOLDER_START_COUNT);
    var shuffler = joy.createShuffler(joy.IDEAS);
    var calm = reducedMotion(doc);

    var count = doc.getElementById('sj-count');
    if (count) count.textContent = joy.formatCount(counter.value());

    var taps = 0;

    // a heart that floats up from the button, and a burst of confetti on every tenth tap
    function playful(fx) {
      taps += 1;
      var heart = doc.createElement('span');
      heart.classList.add('float');
      heart.textContent = '\u2665';
      heart.style.setProperty('--x', Math.round((Math.random() - 0.5) * 120) + 'px');
      heart.addEventListener('animationend', function () { heart.remove(); });
      fx.appendChild(heart);
      // children is a live HTMLCollection in browsers (no filter/shift), so copy it into an array first
      var floats = Array.prototype.filter.call(fx.children, function (c) { return c.classList.contains('float'); });
      while (floats.length > MAX_FLOATS) fx.removeChild(floats.shift());

      if (taps % CONFETTI_EVERY === 0) {
        for (var i = 0; i < CONFETTI_BITS; i++) {
          var bit = doc.createElement('i');
          bit.classList.add('bit');
          var angle = (i / CONFETTI_BITS) * Math.PI * 2;
          var dist = 70 + Math.random() * 60;
          bit.style.setProperty('--dx', Math.round(Math.cos(angle) * dist) + 'px');
          bit.style.setProperty('--dy', Math.round(Math.sin(angle) * dist - 40) + 'px');
          bit.style.setProperty('--c', i % 3 === 0 ? '#fdcd17' : i % 3 === 1 ? '#ffffff' : '#231f20');
          bit.addEventListener('animationend', function (b) { return function () { b.remove(); }; }(bit));
          fx.appendChild(bit);
        }
      }
    }

    function tap() {
      var heart = doc.getElementById('sj-heart');
      var rings = doc.getElementById('sj-rings');
      var number = doc.getElementById('sj-count');
      if (!heart || !rings || !number) return;

      number.textContent = joy.formatCount(counter.tap());

      if (calm) {
        heart.classList.add('pulse');
        setTimeout(function () { heart.classList.remove('pulse'); }, 300);
        return;
      }

      var fx = doc.getElementById('sj-fx');
      if (fx) playful(fx);
      number.classList.add('bump');
      setTimeout(function () { number.classList.remove('bump'); }, 250);

      var ring = doc.createElement('span');
      ring.classList.add('ring');
      ring.addEventListener('animationend', function () { ring.remove(); });
      rings.appendChild(ring);
      while (rings.children.length > MAX_RINGS) rings.removeChild(rings.children[0]);
    }

    function clearDone() {
      var note = doc.getElementById('sj-done');
      if (!note) return;
      note.hidden = true;
      note.textContent = '';
    }

    function surprise() {
      var idea = doc.getElementById('sj-idea');
      if (idea) idea.textContent = shuffler.next();
      clearDone();
    }

    // "I did it!" from the brainstorm. Nothing is stored; the line only confirms this tap.
    function didIt() {
      var note = doc.getElementById('sj-done');
      if (!note) return;
      note.hidden = false;
      note.textContent = 'You just put more kindness into the world.';
    }

    doc.addEventListener('click', function (e) {
      if (closestWithId(e.target, 'sj-heart')) tap();
      else if (closestWithId(e.target, 'sj-surprise')) surprise();
      else if (closestWithId(e.target, 'sj-did-it')) didIt();
    });
  }

  if (typeof module !== 'undefined' && module.exports) module.exports = { initHome: initHome };

  if (typeof document !== 'undefined' && root.Joy) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { initHome(document, root.Joy); });
    } else {
      initHome(document, root.Joy);
    }
  }
})(typeof window !== 'undefined' ? window : globalThis);

/* ===== PART 3: scroll story, cards, header (assets/scroll-story.js) ===== */
(function (root) {
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  // Pure maths for the pinned story. `progress` is 0..1 through the tall section,
  // `count` is the number of photos/lines. Returns what each photo and line should look like.
  function storyState(progress, count, reduce) {
    var p = clamp(progress, 0, 1);
    var seg = p * count * 0.999;
    var index = Math.min(count - 1, Math.floor(seg));
    var local = seg - index;
    var frames = [];
    var lines = [];
    for (var i = 0; i < count; i++) {
      // each photo stays opaque once shown; the next one fades in over the last 22% of the current segment
      var opacity = i <= index ? 1 : (i === index + 1 ? clamp((local - 0.78) / 0.22, 0, 1) : 0);
      // each photo settles from slightly zoomed-in to normal size
      var scale = reduce ? 1 : 1.12 - 0.12 * clamp((seg - (i - 0.3)) / 0.7, 0, 1);
      frames.push({ opacity: opacity, scale: scale });

      var d = seg - (i + 0.42);
      lines.push({
        opacity: reduce ? (i === index ? 1 : 0) : clamp(1 - Math.abs(d) * 2.3, 0, 1),
        shift: reduce ? 0 : -d * 36
      });
    }
    return { index: index, frames: frames, lines: lines };
  }

  // The story slides up over the hero photo like a sheet: its top corners are rounded while it is
  // below the top of the screen and square off as it arrives; the hero photo dims underneath.
  function sheetState(storyTop, vh) {
    var arrived = clamp(1 - storyTop / vh, 0, 1);
    return { radius: Math.round(40 * clamp(storyTop / 60, 0, 1)), dim: 1 - 0.35 * arrived };
  }

  // Elements are looked up on every update, never kept: Squarespace can re-draw a Code Block's
  // HTML after this script has started, which would leave kept references pointing at removed nodes.
  function initStory(doc, win) {
    var reduce = !!(win.matchMedia && win.matchMedia('(prefers-reduced-motion: reduce)').matches);

    function all(root, sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); }

    function tick() {
      var y = win.scrollY, vh = win.innerHeight;

      // fade things in once they come into view
      all(doc, '.reveal').forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.top < vh * 0.92 && r.bottom > 0) el.classList.add('in');
      });

      var story = doc.getElementById('story');
      if (!story) return;
      var sheet = sheetState(story.getBoundingClientRect().top, vh);
      var pin = story.querySelector('.stage-pin');
      if (pin) pin.style.borderRadius = sheet.radius + 'px ' + sheet.radius + 'px 0 0';
      var hero = doc.getElementById('heroCard');
      if (hero) hero.style.filter = sheet.dim < 1 ? 'brightness(' + sheet.dim.toFixed(3) + ')' : '';
      var frames = all(story, '.frame');
      var lines = all(story, '.line');
      var dots = all(story, '.dots i');
      var span = story.offsetHeight - vh;
      // offsetTop is relative to the nearest positioned parent, which on Squarespace is not the page
      var top = story.getBoundingClientRect().top + y;
      var state = storyState(span > 0 ? (y - top) / span : 0, frames.length, reduce);
      frames.forEach(function (f, i) {
        f.style.opacity = state.frames[i].opacity;
        f.style.transform = 'scale(' + state.frames[i].scale + ')';
      });
      lines.forEach(function (l, i) {
        l.style.opacity = state.lines[i].opacity;
        l.style.transform = 'translateY(' + state.lines[i].shift + 'px)';
      });
      dots.forEach(function (d, i) { d.classList.toggle('on', i === state.index); });
    }

    var ticking = false;
    win.addEventListener('scroll', function () {
      if (!ticking) {
        ticking = true;
        win.requestAnimationFrame(function () { tick(); ticking = false; });
      }
    }, { passive: true });
    win.addEventListener('resize', tick);
    tick();
    // blocks that are drawn a moment after load get picked up too
    win.setTimeout && [300, 1000, 2500].forEach(function (ms) { win.setTimeout(tick, ms); });
  }

  // Cards row: a mouse can drag the row sideways (touch already scrolls natively).
  // Listens on the whole document and finds the row at event time, so a re-drawn row still works.
  function rowOf(node) {
    while (node) { if (node.id === 'cards') return node; node = node.parentNode; }
    return null;
  }

  function initCards(doc) {
    var row = null, moved = false, startX = 0, startLeft = 0;
    doc.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse') return;
      row = rowOf(e.target);
      if (!row) return;
      moved = false; startX = e.clientX; startLeft = row.scrollLeft;
    });
    doc.addEventListener('pointermove', function (e) {
      if (!row) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 5) { moved = true; row.classList.add('dragging'); }
      if (moved) row.scrollLeft = startLeft - dx;
    });
    doc.addEventListener('pointerup', function () {
      if (!row) return;
      row.classList.remove('dragging');
      row = null;
    });

      if (moved && rowOf(e.target)) { e.preventDefault(); e.stopPropagation(); }
      moved = false;
    }, true);
    doc.addEventListener('dragstart', function (e) { if (rowOf(e.target)) e.preventDefault(); });
  }

  // Apple-style bar: tucks away while you scroll down, comes back as soon as you scroll up.

    if (y < 80) return false;
    if (y > prevY + 4) return true;
    if (y < prevY - 8) return false;
    return wasHidden;
  }

  function initHeader(doc, win) {
    var prev = win.scrollY, hidden = false;
    win.addEventListener('scroll', function () {
      var y = win.scrollY;
      var next = headerHidden(prev, y, hidden);
      // only pages that carry the home blocks tuck their header away
      var bar = doc.querySelector('.sj-home') && doc.querySelector('.site-header, #header');
      if (bar && next !== hidden) { hidden = next; bar.classList.toggle('tucked', hidden); }
      prev = y;
    }, { passive: true });
  }

  var api = { sheetState: sheetState, storyState: storyState, initStory: initStory, initCards: initCards, headerHidden: headerHidden, initHeader: initHeader };

    initHeader(document, window);

/* ===== PART 4: floating Give pill (assets/give-pill.js) ===== */
(function (root) {
  // The one place the Give address is written for the floating pill (same as GIVE_URL in build.py).
  var GIVE_URL = 'https://givebutter.com/SpreadJoyCollective';

  // The pill is always in the corner, except while a Give band is already on screen.
  function givePillVisible(band, vh) {
    return !(band && band.top < vh && band.bottom > 0);
  }

  // Everything is looked up on each update: Squarespace re-draws blocks after load.
  function initGive(doc, win) {
    function update() {
      var pill = doc.getElementById('sj-give-pill');
      if (!pill) {
        pill = doc.createElement('a');
        pill.id = 'sj-give-pill';
        pill.className = 'sj-give-pill';
        pill.textContent = 'Give ♥';
        pill.setAttribute('href', GIVE_URL);
        pill.setAttribute('target', '_blank');
        pill.setAttribute('rel', 'noopener');
        doc.body.appendChild(pill);

      var band = doc.getElementById('sj-give');
      var r = band ? band.getBoundingClientRect() : null;
      pill.classList.toggle('on', givePillVisible(r, win.innerHeight));

    win.addEventListener('resize', update);
    update();
    win.setTimeout && [100, 1000, 2500].forEach(function (ms) { win.setTimeout(update, ms); });
  }

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (typeof document !== 'undefined' && typeof window !== 'undefined') {
