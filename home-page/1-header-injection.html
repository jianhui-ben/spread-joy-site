<!--
  PASTE 1 OF 6:   Home page styles
  WHAT IT DOES:   The site header look (white, yellow line, uppercase menu, yellow Give heart pill; this changes the
                  header on every page) and all the look of the home page: fonts, colours, the big headline, the growing photo,
                  the pinned photo story, the yellow "Your turn" band and cards, and the header that
                  tucks away when you scroll down.
  WHERE TO PASTE: Pages > Custom Code > Code Injection > HEADER, then Save. Once for the whole site.
  NEEDS:          A Core, Plus or Advanced plan for Code Injection.
  PLACEHOLDERS:   none
  GENERATED:      by build.py from assets/home.css, assets/styles.css and build.py.
                  Change the sources and run `python3 build.py`; edits made here are overwritten.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&family=Oooh+Baby&display=swap" rel="stylesheet">
<style>
/* Brand colours */
:root { --yellow: #fdcd17; --ink: #231f20; --bg: #ffffff; --muted: #6b6560; }

/* Everything we add lives inside .sj-home so it does not disturb the rest of the site */
.sj-home { font-family: "League Spartan", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); line-height: 1.2; }
.sj-home, .sj-home * { box-sizing: border-box; }
.sj-home img { display: block; max-width: 100%; }
.sj-home a { color: inherit; }

/* --- Squarespace: let our sections run edge to edge, with no padding or gaps around them --- */
.page-section:has(.sj-home) { padding: 0 !important; min-height: 0 !important; }
.page-section:has(.sj-home) .content-wrapper,
.page-section:has(.sj-home) .content { padding: 0 !important; max-width: none !important; width: 100% !important; }
.page-section:has(.sj-home) .fluid-engine { display: block !important; }
.page-section:has(.sj-home) .fe-block { grid-area: auto !important; }
.page-section:has(.sj-home) .sqs-block-code,
.page-section:has(.sj-home) .sqs-block-content { padding: 0 !important; margin: 0 !important; overflow: visible !important; }
/* Squarespace gives headings, paragraphs and buttons their own font; make ours use the brand font */
.page-section:has(.sj-home) .hero { padding-top: 170px; }
:root { color-scheme: only light; }
.sj-home h1, .sj-home h2, .sj-home h3, .sj-home p, .sj-home b, .sj-home button, .sj-home a { font-family: inherit; text-transform: none; font-style: normal; }

/* --- Site header: white, yellow line, uppercase menu, Give heart pill (all pages) --- */
#header .header-background { background: rgba(255, 255, 255, 0.86) !important; -webkit-backdrop-filter: saturate(180%) blur(14px); backdrop-filter: saturate(180%) blur(14px); }
#header, #header .header-inner { background: transparent !important; }
#header .header-border { background: #fdcd17 !important; height: 2px !important; opacity: 1 !important; }
#header .header-dropshadow { display: none !important; }
#header .header-nav-item a { font-family: "League Spartan", system-ui, sans-serif !important; text-transform: uppercase !important; letter-spacing: 0.14em !important; font-weight: 500 !important; font-size: 0.9rem !important; color: #231f20 !important; }
#header .header-nav-item--active a { border-bottom: 3px solid #fdcd17; }
#header .header-actions .btn { background: #fdcd17 !important; color: #231f20 !important; border: 0 !important; border-radius: 999px !important; font-family: "League Spartan", system-ui, sans-serif !important; font-weight: 600 !important; text-transform: none !important; letter-spacing: 0 !important; }
/* logo: yellow heart picture + the name as text, like the localhost header */
#header .header-title-logo img { display: none !important; }
#header .header-title-logo a { display: inline-flex !important; align-items: center; gap: 10px; text-decoration: none; }
#header .header-title-logo a::before { content: ""; width: 34px; height: 34px; background: url(https://images.squarespace-cdn.com/content/v1/6aab64d440806136e6ed3821/cbb418f5-0516-48e5-b071-4673e3ad00b2/heart.png) center / contain no-repeat; }
#header .header-title-logo a::after { content: "Spread Joy Collective"; font-family: "League Spartan", system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.22em; font-weight: 500; font-size: 0.95rem; color: #231f20; white-space: nowrap; }

/* --- Header that tucks away on scroll down (home page only) --- */
body:has(.sj-home) #header { transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1); }
body:has(.sj-home) #header.tucked { transform: translateY(-100%); }

/* --- Button + script-only rules (used by the "Surprise me" card) --- */
/* Rounded button style (yellow); .outline is the white version with a dark border */
.pill {
  display: inline-block; background: var(--yellow); color: var(--ink);
  border: 2px solid var(--yellow); border-radius: 999px; padding: 8px 18px;
  font: inherit; font-weight: 600; text-decoration: none; margin: 4px; cursor: pointer;
}
.pill.outline { background: var(--bg); border-color: var(--ink); }
/* hidden until the script marks the page as .sj-js; survives the editor re-drawing a block */
.sj-needs-js { display: none; }
.sj-js .sj-needs-js { display: inline-block; }
.sj-js .idea.sj-needs-js { display: block; }

/* The line of text where the kindness idea appears */
.idea { min-height: 3.2em; margin: 12px auto 0; max-width: 28em; font-size: 1.25rem; font-weight: 500; }

/* --- Footer block (paste 6) --- */
.sj-footer { background: var(--ink); color: #fff; padding: 56px 0 32px; font-family: "League Spartan", system-ui, sans-serif; line-height: 1.6; }
.sj-footer-wrap { width: min(1180px, 92vw); margin: 0 auto; }
.sj-footer-cols { display: grid; gap: 36px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.sj-footer h4 { margin: 0 0 12px; color: var(--yellow) !important; font-family: inherit !important; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase !important; }
.sj-footer ul { list-style: none; margin: 0; padding: 0; }
.sj-footer li { margin: 8px 0; }
.sj-footer a { color: #fff !important; text-decoration: none; }
.sj-footer a:hover { color: var(--yellow) !important; }
.sj-footer .sj-brand { display: inline-flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 0.22em; font-weight: 500; font-size: 0.95rem; color: #fff !important; }
.sj-footer .sj-brand img { height: 40px; width: auto; }
.sj-footer .sj-accent { margin: 14px 0 0; color: var(--yellow) !important; font-family: "Oooh Baby", cursive; font-size: 1.5rem; line-height: 1.2; }
.sj-footer .sj-legal { margin: 36px 0 0; color: #b8b2ad !important; font-size: 0.8rem; }
.sj-footer .sj-tbd { background: var(--yellow); color: var(--ink) !important; padding: 0 0.25em; }
.sj-signup { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sj-signup input { flex: 1; min-width: 140px; width: auto !important; padding: 12px 16px; border: 0; border-radius: 12px; font: inherit; color: var(--ink); background: #fff; }
.sj-signup button { padding: 12px 24px; min-height: 44px; border: 0; border-radius: 999px; background: var(--yellow); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.sj-form-note { flex-basis: 100%; margin: 4px 0 0; color: #fff !important; font-weight: 500; }
#footer-sections, .sjc-footer { display: none !important; }

/* --- Wave between the photo story and the yellow band --- */
.sj-home .wave { display: block; width: 100%; height: 44px; margin: -1px 0; color: var(--yellow); fill: currentColor; }
.sj-home .wave.flip { transform: scaleY(-1); }

/* --- Home page layout (assets/home.css) --- */
/* Home page only: big headline, growing photo, pinned scrolling story, photo cards.
   Shared colours, fonts and the header come from styles.css. */

/* ---- scroll reveal ---- */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.9s cubic-bezier(0.2, 0.7, 0.2, 1), transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1); }
.reveal.in { opacity: 1; transform: none; }
.reveal.d1 { transition-delay: 0.12s; }
.reveal.d2 { transition-delay: 0.24s; }

/* ---- 1. hero: giant line, photo card that grows as you scroll ---- */
.hero { padding: 56px 0 0; text-align: center; }
.hero h1 { margin: 0; font-size: clamp(3.2rem, 11vw, 9rem); font-weight: 700; letter-spacing: -0.03em; line-height: 0.98; }
.hero .sub { margin: 18px 0 0; font-family: "Oooh Baby", cursive; font-size: clamp(1.8rem, 4vw, 3rem); }
/* full-bleed photo: runs edge to edge, no white margin, no frame */
.hero-card { position: relative; margin: 44px 0 0; width: 100%; height: max(420px, 82vh); overflow: hidden; }
.hero-card > img { width: 100%; height: 100%; object-fit: cover; }
/* the bottom of the photo melts into charcoal, so the story photo that slides over it does not meet a hard edge */
.hero-card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: linear-gradient(transparent, rgba(35, 31, 32, 0.7)); pointer-events: none; }

/* the tap-the-heart pill that sits on the photo */
.tap {
  position: absolute; left: 50%; bottom: calc(9vh + 28px); transform: translateX(-50%); z-index: 1;
  display: flex; align-items: center; gap: 14px; padding: 8px 22px 8px 10px;
  background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 999px;
}
.tap-stage-mini { position: relative; width: 56px; height: 56px; display: grid; place-items: center; }
#sj-heart { position: relative; z-index: 1; background: none; border: 0; padding: 0; cursor: pointer; width: 48px; height: 48px; transition: transform 0.15s; }
#sj-heart:active { transform: scale(0.9); }
#sj-heart:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 12px; }
#sj-heart img { width: 100%; }
.tap .rings { position: absolute; inset: 0; pointer-events: none; }
.tap .ring { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--yellow); transform: translate(-50%, -50%) scale(1); animation: tap-out 1.6s ease-out forwards; }
@keyframes tap-out { to { transform: translate(-50%, -50%) scale(5); opacity: 0; } }
/* floating hearts and confetti, drawn over the photo above the pill */
.fx { position: absolute; left: 50%; bottom: calc(9vh + 72px); width: 0; height: 0; pointer-events: none; }
.fx .float { position: absolute; left: var(--x, 0); bottom: 0; font-size: 28px; line-height: 1; color: var(--yellow); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3); animation: float-up 1.8s ease-out forwards; }
@keyframes float-up { 0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(-50%, -190px) scale(1.25) rotate(14deg); opacity: 0; } }
.fx .bit { position: absolute; left: 0; bottom: 0; width: 9px; height: 14px; border-radius: 2px; background: var(--c, #fdcd17); animation: pop 1.1s cubic-bezier(0.2, 0.7, 0.3, 1) forwards; }
@keyframes pop { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }
.tap b { display: inline-block; }
.tap b.bump { animation: bump 0.25s ease-out; }
@keyframes bump { 0% { transform: translateY(0); } 40% { transform: translateY(-6px) scale(1.12); } 100% { transform: translateY(0); } }
.tap p { margin: 0; font-size: 1rem; color: var(--muted); text-align: left; line-height: 1.2; }
.tap b { color: var(--ink); }

/* ---- 2. pinned story: the stage stays while photos and lines change with scroll ---- */
.story { position: relative; z-index: 2; height: 420vh; margin-top: -9vh; }
.stage-pin { box-shadow: 0 -24px 60px rgba(35, 31, 32, 0.28); }
.stage-pin { position: sticky; top: 0; height: 100vh; overflow: hidden; isolation: isolate; -webkit-mask-image: -webkit-radial-gradient(white, black); }
.frames { position: absolute; inset: 0; overflow: hidden; background: var(--ink); border-radius: inherit; }
.frame { position: absolute; inset: 0; will-change: opacity, transform; }
.frame img { width: 100%; height: 100%; object-fit: cover; }
.frame:nth-child(1) img { object-position: center 28%; }
.shade { position: absolute; inset: 0; background: linear-gradient(transparent 40%, rgba(35, 31, 32, 0.78)); pointer-events: none; }
.lines { position: absolute; left: 0; right: 0; bottom: 12vh; color: #fff; pointer-events: none; }
.line {
  position: absolute; left: 6vw; right: 6vw; bottom: 0; margin: 0;
  font-size: clamp(2.2rem, 6.4vw, 5.6rem); font-weight: 700; letter-spacing: -0.025em; line-height: 1.05;
  opacity: 0; will-change: opacity, transform; text-shadow: 0 2px 24px rgba(0, 0, 0, 0.25);
}
.line .y { color: var(--yellow) !important; }
/* Squarespace colours headings itself, so the colours that must be white or ink are set with !important */
.lines .line, .card h3, .card.surprise .idea { color: #fff !important; }
.hero h1, .turn h2 { color: var(--ink) !important; }
.dots { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.45); transition: background 0.3s, transform 0.3s; }
.dots i.on { background: var(--yellow); transform: scale(1.5); }

/* ---- 3. your turn: yellow band, wave, photo cards you swipe sideways ---- */
.turn { background: var(--yellow); padding: 20px 0 110px; }
.turn h2 { margin: 0 auto 36px; width: min(1180px, 92vw); font-size: clamp(3rem, 9vw, 7rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.cards {
  display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding: 8px max(4vw, calc((100vw - 1180px) / 2)) 28px;
}
.cards::-webkit-scrollbar { display: none; }
.cards { cursor: grab; }
.cards.dragging { cursor: grabbing; scroll-snap-type: none; user-select: none; }
.card {
  position: relative; isolation: isolate; overflow: hidden; scroll-snap-align: start;
  flex: 0 0 min(360px, 78vw); height: min(460px, 66vh); padding: 28px; border-radius: 32px;
  display: flex; flex-direction: column; justify-content: flex-end;
  color: #fff; text-decoration: none; background: var(--ink);
  transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.4s;
}
.card:hover { transform: translateY(-8px); box-shadow: 0 24px 50px rgba(35, 31, 32, 0.28); }
.card > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1); }
.card:hover > img { transform: scale(1.07); }
.card::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(rgba(35, 31, 32, 0) 30%, rgba(35, 31, 32, 0.82)); }
.card h3 { margin: 0; font-size: clamp(1.9rem, 3.2vw, 2.5rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
.card .go {
  position: absolute; top: 22px; right: 22px; width: 48px; height: 48px; border-radius: 50%;
  background: var(--yellow); color: var(--ink); display: grid; place-items: center; font-size: 1.4rem;
  transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.card:hover .go { transform: rotate(-45deg) scale(1.1); }

/* the "Surprise me" card: dark, with a heart that beats */
.card.surprise { justify-content: space-between; align-items: flex-start; }
.card.surprise::after { display: none; }
.card > img.beat { position: static; inset: auto; z-index: auto; width: 96px; height: auto; object-fit: contain; }
.card:hover > img.beat { transform: none; }
.beat { animation: beat 2.4s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.card.surprise .idea { margin: 0; color: #fff; min-height: 4.2em; max-width: none; font-size: 1.35rem; font-weight: 500; }
.card.surprise .joy-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.card.surprise .pill { min-height: 44px; margin: 0; }
.card.surprise .done { margin: 8px 0 0; color: #fff !important; font-size: 1.05rem; }
.hint { width: min(1180px, 92vw); margin: 6px auto 0; font-size: 0.9rem; opacity: 0.7; }

/* ---- give band: live Givebutter goal bar and the Give button ---- */
.give { background: var(--yellow); padding: 8px 0 96px; text-align: center; }
.give h2 { margin: 0 auto 24px; width: min(900px, 92vw); font-size: clamp(2.2rem, 6vw, 4.2rem); font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; color: var(--ink) !important; }
.give .goal { width: min(640px, 88vw); margin: 0 auto 28px; }
.give .pill { padding: 14px 34px; font-size: 1.15rem; background: var(--ink); border-color: var(--ink); color: #fff; }

@media (max-width: 760px) {
  .hero { padding-top: 36px; }
  .hero-card { height: 70vh; }
  .tap { bottom: calc(9vh + 16px); padding-right: 16px; }
  .line { left: 6vw; right: 6vw; }
  .lines { bottom: 10vh; }
  .dots { right: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  .frame, .line { transform: none !important; }
  .tap .ring, .beat, .tap b.bump { animation: none; }
  .fx { display: none; }
  .tap .ring { display: none; }
  .card, .card > img { transition: none; }
}

/* floating Give pill: always in the corner, steps aside while the Give band is on screen */
.sj-give-pill {
  position: fixed; right: 20px; bottom: 20px; z-index: 50; padding: 12px 22px; border-radius: 999px;
  background: var(--yellow); color: var(--ink) !important; font-weight: 700; text-decoration: none;
  box-shadow: 0 8px 24px rgba(35, 31, 32, 0.25); opacity: 0; transform: translateY(24px); pointer-events: none;
  transition: opacity 0.35s, transform 0.35s;
}
.sj-give-pill.on { opacity: 1; transform: none; pointer-events: auto; }

@media (prefers-reduced-motion: reduce) { .sj-give-pill { transition: none; } }
</style>
<script>
/* The header button is Squarespace's own. Relabel Donate or a plain Give so it matches the local header. */
(function () {
  var LABEL = 'Give \u2665';
  function labelHeader() {
    var nodes = document.querySelectorAll('#header .header-actions a, #header .header-menu-cta a');
    for (var i = 0; i < nodes.length; i++) {
      var text = (nodes[i].textContent || '').replace(/\s+/g, ' ').trim();
      if (text === 'Donate' || text === 'Give') nodes[i].textContent = LABEL;
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', labelHeader);
  labelHeader();
  [300, 1200].forEach(function (ms) { setTimeout(labelHeader, ms); });
})();
</script>
