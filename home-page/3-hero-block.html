<!--
  PASTE 3 OF 6:   Hero: headline and growing photo with the heart
  WHAT IT IS:     Giant headline, the photo that grows as you scroll, and the tap-the-heart pill on top of it.
  WHERE TO PASTE: A Code Block (mode HTML) in the FIRST section of the Home page. It carries its own heart and counter script and the page-open heart effect, so nothing in the Footer injection is needed for either.
  NEEDS:          Pastes 1 and 2 installed once (Code Injection Header and Footer).
  PLACEHOLDERS:   none (addresses come from home-page/image-urls.json)
  GENERATED:      by build.py. Change build.py (HOME_* sections) and run `python3 build.py`.
-->
<div class="sj-home">
<style>
/* Landing-page open effect (heart cover + heart behind the headline). Scoped to .sj-home.
   The hero Code Block carries this; local preview links it. */
.sj-home {
  position: relative;
  isolation: isolate;
}

.sj-home #heart-transition {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  visibility: hidden;
  transform: none !important;
  background: transparent !important;
  --heart-duration: 750ms;
}

.sj-home #heart-transition::before {
  content: "";
  position: absolute;
  width: 100px;
  height: 100px;
  left: 50%;
  top: 28%;
  background: #FFD700;
  clip-path: path("M 50 90 C 40 80 0 55 0 30 C 0 0 35 -5 50 20 C 65 -5 100 0 100 30 C 100 55 60 80 50 90 Z");
  transform: translate(-50%, -50%) scale(0);
  transform-origin: center;
  transition: transform var(--heart-duration) cubic-bezier(.65, 0, .35, 1);
}

.sj-home #heart-transition::after {
  content: "";
  position: absolute;
  width: 100px;
  height: 100px;
  left: 50%;
  top: 28%;
  background-image: url("https://images.squarespace-cdn.com/content/v1/6aab64d440806136e6ed3821/cbb418f5-0516-48e5-b071-4673e3ad00b2/heart.png");
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  transform: translate(-50%, -50%) scale(0);
  transform-origin: center;
  transition: transform var(--heart-duration) cubic-bezier(.65, 0, .35, 1);
}

.sj-home #heart-transition.visible { visibility: visible; }
.sj-home #heart-transition.cover::before { transform: translate(-50%, -50%) scale(50); }
.sj-home #heart-transition.cover::after { transform: translate(-50%, -50%) scale(0); }
.sj-home #heart-transition.persistent::after { transform: translate(-50%, -50%) scale(4); }

.sj-home .hero h1,
.sj-home .hero .sub {
  position: relative;
  z-index: 2;
}

@media (prefers-reduced-motion: reduce) {
  .sj-home #heart-transition { --heart-duration: 150ms; }
}
</style>
<section class="hero">
  <h1 class="reveal">Small acts. <br>Big impact.</h1>
  <p class="sub reveal d1">Spread joy.</p>
  <div class="hero-card" id="heroCard">
    <img src="https://images.squarespace-cdn.com/content/v1/6aab64d440806136e6ed3821/7b9fca5b-4da1-428f-aa3e-2037ab505ebc/socks-circle-hero.jpg" alt="A circle of volunteers holding up socks they collected">
    <div id="sj-fx" class="fx" aria-hidden="true"></div>
    <div class="tap">
      <div class="tap-stage-mini">
        <div id="sj-rings" class="rings" aria-hidden="true"></div>
        <button id="sj-heart" type="button" aria-label="Tap to send a ripple of joy"><img src="https://images.squarespace-cdn.com/content/v1/6aab64d440806136e6ed3821/cbb418f5-0516-48e5-b071-4673e3ad00b2/heart.png" alt=""></button>
      </div>
      <p aria-live="polite"><b id="sj-count">1,284</b> ripples of joy</p>
    </div>
  </div>
</section>

<script>
(function (root) {
  // The "ripples of joy" heart and counter. This file is self-contained: the hero Code Block carries it
  // on its own (see home-page/3-hero-block.html), so no site-wide or footer script is needed for it.
  //
  // PLACEHOLDER: made-up starting number. Replace with real data later. There is no server, so the count
  // is not shared between visitors: each browser adds only its own taps to this number and remembers
  // them (localStorage, key below).
  var PLACEHOLDER_START_COUNT = 1284;
  var STORAGE_KEY = 'sj-ripples';
  var MAX_RINGS = 6;
  var MAX_FLOATS = 12;
  var CONFETTI_EVERY = 10;
  var CONFETTI_BITS = 14;

  function formatCount(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // With a storage object (localStorage) the visitor's own taps are remembered between visits.
  // Storage can be missing or blocked (private windows); the counter then just works for this visit.
  function createCounter(start, storage) {
    var own = 0;
    try {
      var saved = parseInt(storage && storage.getItem(STORAGE_KEY), 10);
      if (saved > 0) own = saved;
    } catch (e) {}
    return {
      value: function () { return start + own; },
      tap: function () {
        own += 1;
        try { if (storage) storage.setItem(STORAGE_KEY, String(own)); } catch (e) {}
        return start + own;
      }
    };
  }

  function reducedMotion(doc) {
    var view = doc.defaultView;
    return !!(view && view.matchMedia && view.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function closestWithId(node, id) {
    while (node) {
      if (node.id === id) return node;
      node = node.parentNode;
    }
    return null;
  }

  // The click listener is on the whole document and elements are looked up at click time, because
  // Squarespace re-draws a Code Block's HTML after load. Running this again (the block was re-drawn and
  // its script ran twice) only refreshes the number; it never adds a second listener.
  function initRipples(doc, storage) {
    var html = doc.documentElement;
    var counter = createCounter(PLACEHOLDER_START_COUNT, storage);
    var taps = 0;

    function show() {
      var number = doc.getElementById('sj-count');
      if (number) number.textContent = formatCount(counter.value());
    }
    show();

    if (html && html.classList.contains('sj-ripples-on')) return;
    if (html) html.classList.add('sj-ripples-on');

    // Other scripts on the page may write their own number later; put ours back once the page has loaded.
    var view = doc.defaultView;
    if (view && view.addEventListener) view.addEventListener('load', show);

    // a heart that floats up from the button, and a burst of confetti on every tenth tap
    function playful(fx) {
      taps += 1;
      var heart = doc.createElement('span');
      heart.classList.add('float');
      heart.textContent = '♥';
      heart.style.setProperty('--x', Math.round((Math.random() - 0.5) * 120) + 'px');
      heart.addEventListener('animationend', function () { heart.remove(); });
      fx.appendChild(heart);
      // children is a live HTMLCollection in browsers (no filter/shift), so copy it into an array first
      var floats = Array.prototype.filter.call(fx.children, function (c) { return c.classList.contains('float'); });
      while (floats.length > MAX_FLOATS) fx.removeChild(floats.shift());

      if (taps % CONFETTI_EVERY === 0) {
        for (var i = 0; i < CONFETTI_BITS; i++) {
          var bit = doc.createElement('i');
          bit.classList.add('bit');
          var angle = (i / CONFETTI_BITS) * Math.PI * 2;
          var dist = 70 + Math.random() * 60;
          bit.style.setProperty('--dx', Math.round(Math.cos(angle) * dist) + 'px');
          bit.style.setProperty('--dy', Math.round(Math.sin(angle) * dist - 40) + 'px');
          bit.style.setProperty('--c', i % 3 === 0 ? '#fdcd17' : i % 3 === 1 ? '#ffffff' : '#231f20');
          bit.addEventListener('animationend', function (b) { return function () { b.remove(); }; }(bit));
          fx.appendChild(bit);
        }
      }
    }

    function tap() {
      var heart = doc.getElementById('sj-heart');
      var rings = doc.getElementById('sj-rings');
      var number = doc.getElementById('sj-count');
      if (!heart || !rings || !number) return;

      number.textContent = formatCount(counter.tap());

      if (reducedMotion(doc)) {
        heart.classList.add('pulse');
        setTimeout(function () { heart.classList.remove('pulse'); }, 300);
        return;
      }

      var fx = doc.getElementById('sj-fx');
      if (fx) playful(fx);
      number.classList.add('bump');
      setTimeout(function () { number.classList.remove('bump'); }, 250);

      var ring = doc.createElement('span');
      ring.classList.add('ring');
      ring.addEventListener('animationend', function () { ring.remove(); });
      rings.appendChild(ring);
      while (rings.children.length > MAX_RINGS) rings.removeChild(rings.children[0]);
    }

    // Capture phase, and the tap is claimed here so no other script on the page counts it a second time.
    doc.addEventListener('click', function (e) {
      if (!closestWithId(e.target, 'sj-heart')) return;
      if (e.stopPropagation) e.stopPropagation();
      tap();
    }, true);
  }

  // Reading localStorage can throw (blocked cookies, some private windows), so ask for it carefully.
  function browserStorage() {
    try { return root.localStorage || null; } catch (e) { return null; }
  }

  var Ripples = {
    PLACEHOLDER_START_COUNT: PLACEHOLDER_START_COUNT,
    formatCount: formatCount,
    createCounter: createCounter,
    initRipples: initRipples
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = Ripples;
  root.Ripples = Ripples;

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { initRipples(document, browserStorage()); });
    } else {
      initRipples(document, browserStorage());
    }
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
(function (root) {
  // Page-open effect on the landing page: a yellow heart-shaped cover shrinks away to reveal the page,
  // and a heart stays behind the headline. Added by a teammate on the Squarespace master; the styles are
  // in assets/heart-transition.css. Like the heart counter, the hero Code Block carries it on its own.
  var DURATION = 750;
  var DURATION_REDUCED = 150;

  // The landing page is "/" or "/home" on Squarespace, and "/index.html" in the local preview.
  function isHomePath(path) {
    var p = path.replace(/\/$/, '');
    return p === '' || p === '/home' || p === '/index.html';
  }

  function initHeartTransition(doc, win) {
    if (win.self !== win.top) return; // not inside the editor's preview frame

    var container = doc.querySelector('.sj-home');
    if (!container || container.querySelector('#heart-transition')) return;
    if (!isHomePath(win.location.pathname)) return;

    var duration = win.matchMedia('(prefers-reduced-motion: reduce)').matches ? DURATION_REDUCED : DURATION;

    var heart = doc.createElement('div');
    heart.id = 'heart-transition';
    heart.setAttribute('aria-hidden', 'true');
    container.insertBefore(heart, container.firstChild);

    // start fully covered with no animation, then let it shrink on the next painted frame
    heart.style.setProperty('--heart-duration', '0ms');
    heart.classList.add('visible', 'cover');
    win.requestAnimationFrame(function () {
      win.requestAnimationFrame(function () {
        heart.style.setProperty('--heart-duration', duration + 'ms');
        heart.classList.remove('cover');
        heart.classList.add('persistent');
      });
    });
  }

  var api = { initHeartTransition: initHeartTransition, isHomePath: isHomePath };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;

  if (typeof document !== 'undefined' && typeof window !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { initHeartTransition(document, window); }, { once: true });
    } else {
      initHeartTransition(document, window);
    }
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</div>
